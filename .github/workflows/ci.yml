name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Install tools
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

  test:
    name: ${{ matrix.project }} (${{ matrix.framework }}, EF ${{ matrix.sqlserver-ef }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [Tests, PostgreSQL.Tests, MySql.Tests, SqlServer.Tests]
        framework: [net10.0, net11.0]
        sqlserver-ef: ['10.0.0']
        include:
          - project: Tests
            framework: net11.0
            sqlserver-ef: '11.0.0'
          - project: SqlServer.Tests
            framework: net11.0
            sqlserver-ef: '11.0.0'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Test
        run: >
          dotnet test tests/EntityFrameworkCore.Locking.${{ matrix.project }}
          --configuration Release
          --framework ${{ matrix.framework }}
          -p:TargetFrameworks=${{ matrix.framework }}
          -p:SqlServerEfCoreVersion=${{ matrix.sqlserver-ef }}
          --logger "console;verbosity=normal"
