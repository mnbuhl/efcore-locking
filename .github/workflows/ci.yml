name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Install tools
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

  test:
    name: ${{ matrix.project }} (${{ matrix.framework }}, EF ${{ matrix.ef-major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [Tests, PostgreSQL.Tests, MySql.Tests, SqlServer.Tests]
        framework: [net10.0, net11.0]
        ef-major: ['10', '11']
        exclude:
          - framework: net10.0
            ef-major: '11'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Test
        run: >
          dotnet test tests/EntityFrameworkCore.Locking.${{ matrix.project }}
          --configuration Release
          --framework ${{ matrix.framework }}
          -p:TargetFrameworks=${{ matrix.framework }}
          -p:EfCoreMajor=${{ matrix.ef-major }}
          --logger "console;verbosity=normal"
      - name: Verify resolved EF Core and provider versions
        env:
          PROJECT: ${{ matrix.project }}
          EF_MAJOR: ${{ matrix.ef-major }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          project = os.environ['PROJECT']
          path = f'tests/EntityFrameworkCore.Locking.{project}/obj/project.assets.json'
          packages = json.load(open(path))['libraries']
          provider = {'PostgreSQL.Tests': 'Npgsql.EntityFrameworkCore.PostgreSQL',
                      'MySql.Tests': 'Microting.EntityFrameworkCore.MySql'}.get(
                          project, 'Microsoft.EntityFrameworkCore.SqlServer')
          for package in ['Microsoft.EntityFrameworkCore', provider]:
              resolved = [key.split('/')[1] for key in packages if key.startswith(package + '/')]
              assert len(resolved) == 1 and resolved[0].startswith(os.environ['EF_MAJOR'] + '.'), (package, resolved)
              print(f'{package}: {resolved[0]}')
          PYTHON
